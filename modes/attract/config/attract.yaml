shows:
  attract_music_lights:
    - duration: .39s
      lights:
        (left): on
        (right): off
        (center): off
    - duration: .39s
      lights:
        (left): off
        (right): on
        (center): off
    - duration: .39s
      lights:
        (left): off
        (right): off
        (center): on
    - duration: .20s
      lights:
        (left): on
        (right): on
        (center): on
    - duration: .19s
      lights:
        (left): off
        (right): off
        (center): off
  jb_hurry_up_foggy_mountain:
    - duration: -1
      slides:
        jb_hurry_up_foggy_mountain:
          widgets:
          - type: video
            video: jb_hurry_up_foggy_mountain
            volume: 0
            animations:
              show_slide:
                - property: volume
                  value: 1
                  duration: 2s
            control_events:
              - event: flipper_cancel
                action: stop
          target: stage
