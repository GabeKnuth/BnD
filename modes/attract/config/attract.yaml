timers:
  video_timer:
    start_value: 600
    end_value: 0
    direction: down
    tick_interval: 1s
    start_running: true
    restart_on_complete: true
    control_events:
      - event: flipper_cancel
        action: stop
      - event: test_accelerate
        action: jump
        value: 2

