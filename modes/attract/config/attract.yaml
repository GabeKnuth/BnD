sound_player:
  mode_attract_started:
    base_bed_loop:
      action: play
      loops: -1
      mode_end_action: stop

  s_start_active:
    start_pool:
      action: play

  timer_video_timer_complete:
    base_bed_loop:
      fade_out: 500ms
      action: stop

  fade_in_music:
    base_bed_loop:
      fade_in: 500ms
      action: play
    
  


