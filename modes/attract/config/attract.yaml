show_player:
  mode_attract_started:
    attract_dmd_loop:
      loops: -1
    attract_stage_loop:
      priority: 100
      loops: -1
    ######gi_on: #{} #This was in there...not sure why.
    center_light_sweep:
      speed: 2
    attract_music_lights:
      loops: -1
      show_tokens:
        left: left
        center: center
        right: right
    flash:
      loops: -1
      show_tokens:
        led: l_start_button
  flipper_cancel:
    music_video: stop
  sw_right_flipper:
    attract_dmd_loop:
      action: advance
  sw_left_flipper:
    attract_dmd_loop:
      action: step_back
  mode_attract_stopped:
    attract_dmd_loop:
      action: stop
    attract_stage_loop:  # todo test if we have to do this?
      action: stop
      #target: stage
    attract_music_lights:
      action: stop
    music_video: stop

