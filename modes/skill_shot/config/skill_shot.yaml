slide_player:
  mode_skill_shot_started:
    skill_shot_stage:
      target: stage
    player_start:
      target: dmd
  s_topkicker_active:
    skill_shot_made:
      target: dmd
      expire: 3s
  succesful_eject:
    player_start:
      action: remove
      target: dmd
  end_skill_shot:
    skill_shot_stage:
      action: remove
      target: stage
  skill_shot_fail:
    skill_shot_stage:
      action: remove
      target: stage
      force: true

