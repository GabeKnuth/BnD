      action: play

#             88  88           88                         
#             88  ""           88                         
#             88               88                         
#  ,adPPYba,  88  88   ,adPPYb,88   ,adPPYba,  ,adPPYba,  
#  I8[    ""  88  88  a8"    `Y88  a8P_____88  I8[    ""  
#   `"Y8ba,   88  88  8b       88  8PP"""""""   `"Y8ba,   
#  aa    ]8I  88  88  "8a,   ,d88  "8b,   ,aa  aa    ]8I  
#  `"YbbdP"'  88  88   `"8bbdP"Y8   `"Ybbd8"'  `"YbbdP"'

slides:
  skill_shot_stage:
    widgets:
      - type: video
        video: ss_skill_shot
        end_behavior: loop
    target: stage
  player_start:
    widgets:
      - type: text
        text: PLAYER (number) UP
        style: huge 
        color: ff4400
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 150ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 150ms
            repeat: true
            easing: in_quint
      - type: text
        text: SEE STAGE FOR SKILLSHOT!
        style: small 
        anchor_y: top
        y: top
        color: red
      - type: text
        text: BALL (ball)
        style: small 
        anchor_y: bottom
        y: bottom+1
        anchor_x: left
        x: left
      - type: text
        text: (score)
        style: small 
        min_digits: 2
        number_grouping: true
        anchor_y: bottom
        y: bottom+1
        anchor_x: right
        x: right
    target: dmd
  skill_shot_made:
    widgets:
      - type: text
        text: SKILL
        style: big #dmd_big
        color: yellow
        anchor_y: top
        y: top-4
        anchor_x: left
        x: left
      - type: text
        text: SHOT
        style: big #dmd_big
        color: yellow
        anchor_y: top
        y: top-4
        anchor_x: left
        x: 34
      - type: text
        text: COLLECTED
        style: big #dmd_big
        color: yellow
        anchor_y: top
        y: top-4
        anchor_x: right
        x: right
      - type: text
        text: 500000
        number_grouping: true
        style: big #dmd_big
        anchor_y: bottom
        y: bottom+4
        animations:
          show_slide:
            - property: opacity
              value: .3
              duration: 150ms
            - property: opacity
              value: 1
              duration: 150ms
              repeat: true

