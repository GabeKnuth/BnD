slide_player:
  mode_honky_tonk_multiball_started:
    honky_tonk_dmd_intro:
      expire: 5.4s
      target: dmd
  slide_honky_tonk_dmd_intro_removed:
    honky_tonk_stage:
      target: stage
    honky_tonk_instructions:
      target: dmd
      expire: 5s
  slide_honky_tonk_instructions_removed:
    honky_tonk_dmd:
      target: dmd
  sw_jukebox_hit:
    honky_tonk_dmd:
      target: dmd
  htmb_jackpot_complete:
    jackpot_slide:
      target: dmd
      expire: 1.5s
  htmb_double_jackpot_complete:
    double_jackpot_slide:
      target: dmd
      expire: 1.5s

#             88  88           88                         
#             88  ""           88                         
#             88               88                         
#  ,adPPYba,  88  88   ,adPPYb,88   ,adPPYba,  ,adPPYba,  
#  I8[    ""  88  88  a8"    `Y88  a8P_____88  I8[    ""  
#   `"Y8ba,   88  88  8b       88  8PP"""""""   `"Y8ba,   
#  aa    ]8I  88  88  "8a,   ,d88  "8b,   ,aa  aa    ]8I  
#  `"YbbdP"'  88  88   `"8bbdP"Y8   `"Ybbd8"'  `"YbbdP"'

slides:
  honky_tonk_dmd:
    widgets:
      - type: text
        text: (score)
        number_grouping: true
        style: huge 
        font_size: 24
        anchor_y: top
        y: top+3
      - type: text
        text: JACKPOT = (player|htmb_jackpot_value)
        number_grouping: true
        style: medium 
        color: gold
        anchor_y: bottom
        y: bottom+1
        animations:
          show_slide:
            - property: opacity
              value: 1
              duration: .3s
            - property: opacity
              value: .6
              duration: .3s
              repeat: true
      - type: rectangle
        width: 128
        height: 32
        color: black
        opacity: .5
      - type: image
        image: honky_tonk

  honky_tonk_instructions:
    widgets:
      - type: text
        text: HONKY TONK
        style: big #dmd_big
        anchor_y: top
        y: top
        color: yellow
      - type: text
        text: MULTIBALL
        style: huge 
        anchor_y: top
        y: top-8
        color: red
      - type: text
        style: small 
        text: JACKPOT STARTS AT 250k
        anchor_y: bottom
        y: bottom+1
        animations:
          show_slide:
            - property: opacity
              value: 1
              duration: 2s
            - property: opacity
              value: 0
      - type: text
        style: small 
        opacity: 0
        anchor_y: bottom
        y: bottom+1
        text: JUKEBOX ADDS TO JACKPOT
        animations:
          show_slide:
            - property: opacity
              value: 0
              duration: 2s
            - property: opacity
              value: 1
  honky_tonk_dmd_intro:
    widgets:
      - type: video
        video: htmb_dmd_intro
        anchor_x: left
        x: left
  ball_saved:
    widgets:
      - type: text
        text: BALL SAVED!
        expire: 2s
        style: huge 
  honky_tonk_stage: 
    widgets:
      - type: video
        volume: 0.4
        video: htmb_miss_honky_tonk
        end_behavior: loop
        control_events:
          - event: duck
            action: volume
            value: .4
          - event: unduck
            action: volume
            value: 1.0  
  double_jackpot_slide:
    widgets:
      - type: image
        image: double_jackpot_top
        anchor_x: left
        x: right
        anchor_y: top
        y: top
        animations:
          show_slide:
            - property: x
              value: 0
              duration: .3s
      - type: image
        image: double_jackpot_bottom
        anchor_x: left
        x: right
        animations:
          show_slide:
            - property: x
              value: 128
              duration: .5s
            - property: x
              value: 0
              duration: .3s
  jackpot_slide:
    widgets:
      - type: image
        image: jackpot
        anchor_x: left
        x: right
        anchor_y: top
        y: top
        animations:
          show_slide:
            - property: x
              value: 0
              duration: .2s

