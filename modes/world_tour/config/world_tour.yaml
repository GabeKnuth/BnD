timers:
    world_tour_timer:
        start_value: 20
        max_value: 20
        tick_interval: 1.25s
        direction: down
        control_events:
          - event: timer_wt_intro_timer_complete
            action: start
          - event: slow_down_timer #player_world_tour_world_tour_timer_tick{value == 5}
            action: change_tick_interval
            value: 1.5
          - event: add_time
            action: add
            value: 10
          - event: s_subwayopto_active
            action: stop
          - event: stop_world_tour_timer
            action: stop
          - event: balldevice_bd_lower_vuk_ball_eject_success
            action: start
          - event: balldevice_bd_top_kicker_ball_eject_success
            action: start
    wt_intro_timer:
        start_value: 3
        direction: down
        control_events:
          - event: mode_world_tour_started
            action: start


