#config_version=5

# Quick description: Hit the four shots in order to complete the World Tour. North America first, then
# Europe, S. America, and Australia. Each shot adds time to the timer. If you run out of time, you fail 
# the mode. Mode should pick up where left off. Must complete mode for Metal Rodeo (I think?)

mode:
  priority: 500
  start_events: start_world_tour_mode
  stop_events: stop_world_tour, start_jukebox_two_ball

