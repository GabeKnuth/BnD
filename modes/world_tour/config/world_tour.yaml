event_player:
  mode_world_tour_started:
    - wt_mode_running|3s
    - enable_north_america|1s
    - fade_out_base_music
    - mission_started
  player_world_tour_world_tour_timer_tick{value == 5}:
    - slow_down_timer
  ag_world_tour_complete:
    - light_australia
    - duck
    - unduck|1.7s
    - world_tour_success|2.5s
    - australia_instruction|1.7s
  wt_australia_complete:
    - world_tour_fade_out|4.5s
    - start_jukebox_two_ball|4.5s
    - release_wt_ball|4.5s
    - stop_world_tour|4.5s
  timer_world_tour_timer_complete:  # fail message QIO todo and adjust timings below
    - stop_world_tour|1s
    #- world_tour_fade_out
    - stop_world_tour_timer
    - world_tour_fail|1s
    - fade_in_base_music|1s
  mode_world_tour_stopping:
    - enable_base_left_vuk_hold
  ball_will_end:
    - world_tour_fail
    - stop_world_tour
  timer_wt_intro_timer_complete:
    - release_left_vuk_ball
    - disable_base_left_vuk_hold
    - release_top_kicker_ball
    - disable_base_top_kicker_hold
  enable_north_america:
    - play_left_orbit_sound|1s
  # wt_north_america_complete:
  #   - play_spinner_sound|1s
  # wt_europe_complete:
  #   - play_right_ramp_sound|1s
  wt_north_america_complete:
    - play_wt_north_america|3s
  wt_europe_complete:
    - play_wt_europe|3s
  wt_south_america_complete:
    - play_wt_south_america|3s
    - play_wt_shoot_australia|6s
  


