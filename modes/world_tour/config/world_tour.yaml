# We also have a video bed for this mode, so we have to figure out a way to play that video bed
# first, then play the plane animations over that, returning to the video when they're done. Let's
# try putting that on a slide, then playing shows over it.

slides:
  wt_complete:
    widgets:
      - type: text
        text: WORLD TOUR
        style: huge 
        font_size: 90
        color: yellow
        animations:
          show_slide:
            - property: font_size
              value: 33
              duration: .2s
            - property: font_size
              value: 33
              duration: .8s
            - property: font_size
              value: 0
              duration: .2s
            - property: opacity
              value: 0
      - type: text
        text: COMPLETE
        style: huge 
        font_size: 90
        opacity: 0
        color: yellow
        animations:
          show_slide:
            - property: font_size
              value: 90
              duration: 1s
            - property: opacity
              value: 1
              duration: 1ms
            - property: font_size
              value: 33
              duration: .2s
            - property: font_size
              value: 33
              duration: 1s

  wt_intro_dmd:
    widgets:
      - type: text
        text: Hit flashing shots
        anchor_y: top
        style: small 
        y: top-1
        anchor_x: right
        x: right-1
      - type: text
        text: to complete the
        style: small 
        anchor_y: bottom
        y: center
        anchor_x: right
        x: right-1
      - type: text
        text: WORLD TOUR!
        style: big #dmd_big
        anchor_y: bottom
        y: bottom+1
        anchor_x: right
        x: right-1
      - type: video
        video: wt_spinny_globe_dmd
        end_behavior: loop
        anchor_x: left
        x: left
    target: dmd


  world_tour_dmd:
    widgets:
      - type: text
        text: Time left (world_tour_world_tour_timer_tick)
        anchor_y: bottom
        style: small 
        y: bottom+1
        anchor_x: right
        x: right-1
      - type: text
        text: (player1|score)
        number_grouping: true
        min_digits: 2
        anchor_x: right
        x: right-1
        y: middle
        style: huge
      - type: text
        text: Each hit = 1 million
        anchor_y: top
        style: small 
        y: top-1
        anchor_x: right
        x: right-1
      - type: video
        video: wt_spinny_globe_dmd
        end_behavior: loop
        anchor_x: left
        x: left
  world_tour_complete:
    widgets:
      - type: video
        video: wt_spinny_globe_dmd
        end_behavior: loop
        anchor_x: left
        x: left
      - type: text
        text: World Tour
        anchor_y: top
        style: medium 
        y: top-4
        anchor_x: right
        x: right-9
      - type: text
        text: Complete!
        number_grouping: true
        min_digits: 2
        anchor_x: right
        x: right-6
        anchor_y: bottom
        y: bottom+1
        style: huge
  world_tour_complete2:
    widgets:      
      - type: text
        text: Shoot Australia For
        anchor_y: top
        style: small 
        y: top-4
        anchor_x: right
        x: right
      - type: text
        text: MULTIBALL!
        number_grouping: true
        min_digits: 2
        anchor_x: right
        x: right-10
        anchor_y: bottom
        y: bottom+1
        style: huge
      - type: video
        video: wt_spinny_globe_dmd
        end_behavior: loop
        anchor_x: left
        x: left

