slides:
  qmb_intro_dmd:
    widgets:
      - type: text
        text: QUARTER MULTIBALL
        anchor_y: top
        style: big #dmd_big
        y: top-1
        anchor_x: right
        x: right
        color: lime
      - type: text
        text: QUARTERS ADD BALLS
        style: medium 
        anchor_y: bottom
        y: bottom+10
        anchor_x: right
        x: right-1
        color: gold
      - type: text
        text: JUKEBOX SCORES 250K
        style: small 
        anchor_y: bottom
        y: bottom+1
        anchor_x: right
        x: right-1
      - type: rectangle
        width: 128
        height: 32
        color: black
        opacity: .4
      - type: video
        video: qmb_quarter2
        end_behavior: loop
        anchor_x: left
        x: left
    target: dmd
  qmb_stage:
    widgets:
      - type: video
        volume: 0.4
        video: qmb_put_a_girl_in_it
        end_behavior: loop
        animations:
          qmb_fade_out:
            - property: volume
              value: 0
              duration: 2s
  qmb_dmd_2_balls:
    widgets:
      - type: text
        text: (score)
        number_grouping: true
        min_digits: 2
        anchor_x: right
        x: right-1
        y: middle+5
        style: huge
      - type: text
        text: JUKEBOX = 250,000
        style: medium 
        anchor_y: bottom
        y: bottom+3
        anchor_x: right
        x: right-1
        color: lime
      - type: rectangle
        width: 128
        height: 32
        color: black
        opacity: .4
      - type: video
        video: qmb_quarter2
        end_behavior: loop
        anchor_x: left
        x: left
      - type: video
        video: qmb_quarter2
        end_behavior: loop
        anchor_x: left
        x: left+32
  qmb_dmd_3_balls:
