  balls_in_play{balls==2}:
    qmb_dmd_2_balls:
      target: dmd
  balls_in_play{balls==3}:
    qmb_dmd_3_balls:
      target: dmd
  balls_in_play{balls==4}:
    qmb_dmd_4_balls:
      target: dmd

