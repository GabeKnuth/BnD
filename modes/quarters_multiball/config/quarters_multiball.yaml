show_player:
  mode_quarters_multiball_started:
    flash:
      loops: -1
      speed: 2
      show_tokens:
        led: quarter
    flash_jukebox:
      loops: -1
  qmb_go:
    flash:
      show_tokens:
        lights: l_shoot, l_again
      key: qmb_ball_save
      speed: 1.5
  timer_add_ball_tick{ticks==5}:
    flash:
      show_tokens:
        lights: l_shoot, l_again
      key: qmb_ball_save
      speed: 3
  timer_add_ball_complete:
      qmb_ball_save: stop

