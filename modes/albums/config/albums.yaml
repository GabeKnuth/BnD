sound_player:
  num_albums{count == 1}:
    ma_silver:
      action: play
      loops: 0
  num_albums{count == 2}:
    ma_gold:
      action: play
      loops: 0
  num_albums{count == 4}:
    ma_platinum:
      action: play
      loops: 0
  num_albums{count == 7}:
    ma_double_platinum:
      action: play
      loops: 0
  num_albums{count == 12}:
    ma_quintuple_platinum:
      action: play
      loops: 0
  num_albums{count >= 20}:
