slide_player:
  num_albums{count == 1}:
    album_silver:
      expire: 2s
      priority: 160
  num_albums{count == 2}:
      album_gold:
        expire: 2s
        priority: 160
  num_albums{count == 4}:
      album_platinum:
        expire: 2s
        priority: 160
  num_albums{count == 7}:
      album_platinum:
        expire: 2s
        priority: 160
  num_albums{count == 12}:
      album_platinum:
        expire: 2s
        priority: 160
  num_albums{count >= 20}:
      album_off_the_charts:
        expire: 2s
        priority: 160
  num_albums{count == 3}:
    knockdowns_to_go:
      expire: 2s
      priority: 160
  num_albums{current_player.current_num_albums_difference >= 2}:
    knockdowns_to_go:
      expire: 2s
      priority: 158
  num_albums{current_player.current_num_albums_difference == 1}:
    one_knockdown_to_go:
      expire: 2s
      priority: 159


#             88  88           88                         
#             88  ""           88                         
#             88               88                         
#  ,adPPYba,  88  88   ,adPPYb,88   ,adPPYba,  ,adPPYba,  
#  I8[    ""  88  88  a8"    `Y88  a8P_____88  I8[    ""  
#   `"Y8ba,   88  88  8b       88  8PP"""""""   `"Y8ba,   
#  aa    ]8I  88  88  "8a,   ,d88  "8b,   ,aa  aa    ]8I  
#  `"YbbdP"'  88  88   `"8bbdP"Y8   `"Ybbd8"'  `"YbbdP"'

slides:
  one_knockdown_to_go:
    widgets:
      - type: text
        text: (player|current_num_albums_difference)
        #text: 17
        anchor_y: top
        anchor_x: left
        y: top-1
        x: left+18
        style: big
        color: white
      - type: text
        text: "ALBUM UNTIL"
        color: white
        style: big
        anchor_y: top
        anchor_x: left
        y: top-1
        x: left+33
      - type: text
        text: (player|temp_next_album_name)
        style: huge 
        anchor_y: bottom
        y: bottom-3
        color: white
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 250ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 250ms
            repeat: true
            easing: in_quint
      - type: rectangle
        width: 128
        height: 32
        color: 444444  
  knockdowns_to_go:
    widgets:
      - type: text
        text: (player|current_num_albums_difference)
        #text: 17
        anchor_y: top
        anchor_x: left
        y: top-1
        x: left+18
        style: big
        color: white
      - type: text
        text: "ALBUMS UNTIL"
        color: white
        style: big
        anchor_y: top
        anchor_x: left
        y: top-1
        x: left+33
      - type: text
        text: (player|temp_next_album_name)
        style: huge 
        anchor_y: bottom
        y: bottom-3
        color: white
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 250ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 250ms
            repeat: true
            easing: in_quint
      - type: rectangle
        width: 128
        height: 32
        color: 444444

  album_silver:
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: aaaaaa
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: aaaaaa
        number_grouping: true
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint
  album_gold:
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: gold
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: gold
        number_grouping: true
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint
  album_platinum:  # used for all three platinum awards
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: black
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: black
        number_grouping: true
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint
      - type: rectangle
        width: 128
        height: 32
  album_off_the_charts:
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: black
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: black
        number_grouping: true
      - type: rectangle
        width: 128
        height: 32
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint

