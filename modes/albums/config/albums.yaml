#config_version=5

mode:
  priority: 160
  start_events: mode_base_started




#logic_blocks:
counters:
  albums:
    count_events: drop_target_bank_drop_targets_down
    events_when_hit: num_albums
    persist_state: false
    starting_count: current_player.temp_num_albums
    


event_player:
  player_num_albums: show_album_slide|.1s




variable_player:
 
  num_albums{count==1}:
    album_value:
      int: 25000
      action: set
    album_name:
      string: SILVER
      action: set
    score: 25000
    multiplier:
      int: 2
      action: set
    temp_num_albums: # Used to help preserve album status when multiplier is held. See base mode code.
      int: 1
      action: set
  
  

  num_albums{count==2}:
    album_value:
      int: 50000
      action: set
    album_name:
      string: GOLD
      action: set
    score: 50000
    multiplier:
      int: 3
      action: set
    temp_num_albums:
      int: 2
      action: set


  num_albums{count==3}:
    album_value:
      int: 100000
      action: set
    album_name:
      string: PLATINUM
      action: set
    score: 100000
    multiplier:
      int: 4
      action: set
    temp_num_albums:
      int: 3
      action: set

  num_albums{count==4}:
    album_value:
      int: 200000
      action: set
    album_name:
      string: DOUBLE PLATINUM
      action: set
    score: 200000
    multiplier:
      int: 5
      action: set
    temp_num_albums:
      int: 4
      action: set


  num_albums{count==5}:
    album_value:
      int: 500000
      action: set
    album_name:
      string: QUINTUPLE PLATINUM
      action: set
    score: 500000
    multiplier:
      int: 6
      action: set
    temp_num_albums:
      int: 5
      action: set


  num_albums{count>=6}:  # beyond 6 we don't increase anymore
    album_value:
      int: 2500000
      action: set
    album_name:
      string: OFF THE CHARTS
      action: set
    score: 2500000
    album_int:
      int: 6
    multiplier:
      int: 9
      action: set
    temp_num_albums:
      int: 6
      action: set



slide_player:
  num_albums{count == 1}:
    album_silver:
      expire: 2s
  num_albums{count == 2}:
      album_gold:
        expire: 2s
  num_albums{count == 3}:
      album_platinum:
        expire: 2s
  num_albums{count == 4}:
      album_platinum:
        expire: 2s
  num_albums{count == 5}:
      album_platinum:
        expire: 2s
  num_albums{count >= 6}:
      album_off_the_charts:
        expire: 2s

slides:
  album_silver:
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: aaaaaa
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: aaaaaa
        number_grouping: true
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint
  album_gold:
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: gold
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: gold
        number_grouping: true
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint
  album_platinum:  # used for all three platinum awards
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: black
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: black
        number_grouping: true
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint
      - type: rectangle
        width: 128
        height: 32
  album_off_the_charts:
    widgets:
      - type: text
        text: (player|album_name)
        style: huge 
        y: 22
        color: black
      - type: text
        text: (player|album_value)
        style: big #dmd_big
        y: 7
        color: black
        number_grouping: true
      - type: rectangle
        width: 128
        height: 32
        animations:
          pre_show_slide:
          - property: opacity
            value: 0
            duration: 50ms
            easing: in_quint
          - property: opacity
            value: 1
            duration: 50ms
            repeat: true
            easing: in_quint

