variable_player:
 
  num_albums{count==1}:
    album_value:
      int: 25000
      action: set
    album_name:
      string: SILVER
      action: set
    score: 25000
    multiplier:
      int: 2
      action: set
    temp_num_albums: # Used to help preserve album status when multiplier is held. See base mode code.
      int: 1
      action: set
    temp_next_album_name:
      string: GOLD
      action: set
    temp_next_album_num_albums_count:
      int: 2
      action: set
  
  

  num_albums{count==2}:
    album_value:
      int: 50000
      action: set
    album_name:
      string: GOLD
      action: set
    score: 50000
    multiplier:
      int: 3
      action: set
    temp_num_albums:
      int: 2
      action: set
    temp_next_album_name:
      string: PLATINUM
      action: set
    temp_next_album_num_albums_count:
      int: 4
      action: set


  num_albums{count==4}:
    album_value:
      int: 100000
      action: set
    album_name:
      string: PLATINUM
      action: set
    score: 100000
    multiplier:
      int: 4
      action: set
    temp_num_albums:
      int: 4
      action: set
    temp_next_album_name:
      string: DOUBLE PLATINUM
      action: set
    temp_next_album_num_albums_count:
      int: 7
      action: set

  num_albums{count==7}:
    album_value:
      int: 200000
      action: set
    album_name:
      string: DOUBLE PLATINUM
      action: set
    score: 200000
    multiplier:
      int: 5
      action: set
    temp_num_albums:
      int: 7
      action: set
    temp_next_album_name:
      string: QUINTUPLE PLATINUM
      action: set
    temp_next_album_num_albums_count:
      int: 12
      action: set

  num_albums{count==12}:
    album_value:
      int: 500000
      action: set
    album_name:
      string: QUINTUPLE PLATINUM
      action: set
    score: 500000
    multiplier:
      int: 6
      action: set
    temp_num_albums:
      int: 12
      action: set
    temp_next_album_name:
      string: OFF THE CHARTS
      action: set
    temp_next_album_num_albums_count:
      int: 20
      action: set


  num_albums{count==20}:  # beyond 20 we don't increase anymore
    album_value:
      int: 2500000
      action: set
    album_name:
      string: OFF THE CHARTS
      action: set
    score: 2500000
    album_int:
      int: 6
    multiplier:
      int: 9
      action: set
    temp_num_albums:
      int: 20
      action: set

  # To get current_num_albums_difference, need to know temp_next_album_num_albums_count and the value of the albums counter.

  num_albums{count>=1}:
    current_num_albums_count:
      int: count
      action: set
    
    current_num_albums_difference:
      int: current_player.temp_next_album_num_albums_count - current_player.current_num_albums_count
      action: set


