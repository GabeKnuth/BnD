event_player:
  mode_weak_flippers_started: # THESE ARE PLACEHOLDERS. SHOW WILL PLAY THESE EVENTS
    - weak_flippers_enabled
  timer_weak_flippers_complete:
    - weak_flippers_disabled
    - stop_weak_flippers|100ms
  mode_weak_flippers_stopping:
    - weak_flippers_disabled

#           88                                                         
#    ,d     ""                                                         
#    88                                                                
#  MM88MMM  88  88,dPYba,,adPYba,    ,adPPYba,  8b,dPPYba,  ,adPPYba,  
#    88     88  88P'   "88"    "8a  a8P_____88  88P'   "Y8  I8[    ""  
#    88     88  88      88      88  8PP"""""""  88           `"Y8ba,   
#    88,    88  88      88      88  "8b,   ,aa  88          aa    ]8I  
#    "Y888  88  88      88      88   `"Ybbd8"'  88          `"YbbdP"' 

timers:
  weak_flippers:
    start_value: 30
    tick_interval: 1s
    direction: down
    control_events:
      - event: mode_weak_flippers_started
        action: start

