show_player:
  mode_light_lock_started:
    lock_advertise:
      loops: -1
      show_tokens:
        lights: l_center_lock
  pause_light_lock:
    lock_advertise: 
      action: stop
  resume_light_lock:
    lock_advertise:
      loops: -1
      show_tokens:
        lights: l_center_lock  

