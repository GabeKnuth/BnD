slides:
  lock_lit_slide:
    widgets:
      - type: text
        text: LOCK IS LIT
        style: huge 
        color: black
        font_size: 28
        y: 21
        animations:
          show_slide:
            - property: opacity
              value: 0
              duration: .2s
            - property: opacity
              value: 1
              duration: .2s
              repeat: true
      - type: text
        text: "SHOOT THROUGH "
        color: white
        style: small
        x: 38
        y: 5
      - type: text
        text: "THE SPINNER "
        color: white
        style: small
        y: 5
        x: 101
      - type: rectangle
        width: 128
        height: 26
        y: 21
        color: lime
  ball_locked_slide:
    widgets:
      - type: text
        text: BALL (player|htmb_balls_locked) LOCKED
        style: huge 
        color: black
        font_size: 30
        animations:
          show_slide:
            - property: opacity
              value: 0
              duration: .2s
            - property: opacity
              value: 1
              duration: .2s
              repeat: true
      - type: rectangle
        width: 128
        height: 32
        color: lime

