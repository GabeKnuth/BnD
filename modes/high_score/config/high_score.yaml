high_score:
  _overwrite: True
  categories: !!omap
  - score:
    - GRAND CHAMPION
    - HIGH SCORE 1
    - HIGH SCORE 2
    - HIGH SCORE 3
    - HIGH SCORE 4
  - quarters:
    - QUARTERS CHAMP

  defaults:
    score:
      - GHK: 10000000
      - BSM: 8000000
      - JAB: 6000000
      - QDG: 4000000
      - TIM: 2000000
    quarters:
      - JON: 5




