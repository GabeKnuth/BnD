sound_player:
  mode_hilo_started:
    poker_loop:
      action: play
      loops: -1
      mode_end_action: stop
  
  slide_hilo_intro_active:
    hilo_you_ready:
      action: play

  play_hilo_higher_lower_sound:
    hilo_higher_lower_pool:
      action: play

  hilo_show_card:
    hilo_gamble_or_cash_out_pool:
      action: play

  play_hilo_cash_out_sound:
    hilo_cash_out_pool:
      action: play

  play_hilo_guess_lower_sound:
    hilo_lower_pool:
      action: play
    
  play_hilo_gamble_sound:
    hilo_gamble_pool:
      action: play
  
  play_hilo_guess_higher_sound:
    hilo_higher_pool:
      action: play

  play_hilo_win_sound:
    hilo_win_pool:
      action: play

  play_hilo_lose_sound:
    hilo_lose_pool:
      action: play

  

