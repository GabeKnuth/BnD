#config_version=5
#config_version=4 # Left for reference. Did NOT double check
mode:
  start_events: start_hilo
  stop_events: stop_hilo
  priority: 1000
  code: hilo.HiLo

#                      88           88                                               
#                      ""           88                             ,d                
#                                   88                             88                
#  8b      db      d8  88   ,adPPYb,88   ,adPPYb,d8   ,adPPYba,  MM88MMM  ,adPPYba,  
#  `8b    d88b    d8'  88  a8"    `Y88  a8"    `Y88  a8P_____88    88     I8[    ""  
#   `8b  d8'`8b  d8'   88  8b       88  8b       88  8PP"""""""    88      `"Y8ba,   
#    `8bd8'  `8bd8'    88  "8a,   ,d88  "8a,   ,d88  "8b,   ,aa    88,    aa    ]8I  
#      YP      YP      88   `"8bbdP"Y8   `"YbbdP"Y8   `"Ybbd8"'    "Y888  `"YbbdP"'  
#                                        aa,    ,88                                  
#                                         "Y8bbdP"   

widgets:
  hilo_players_card:
      - type: image
        image:
        x: 34
  hilo_dealer_card:
      - type: image
        image:
        x: 100

#                                                      ,d            
#                                                      88            
#   ,adPPYba,  8b       d8   ,adPPYba,  8b,dPPYba,   MM88MMM         
#  a8P_____88  `8b     d8'  a8P_____88  88P'   `"8a    88            
#  8PP"""""""   `8b   d8'   8PP"""""""  88       88    88            
#  "8b,   ,aa    `8b,d8'    "8b,   ,aa  88       88    88,           
#   `"Ybbd8"'   88 "8"       `"Ybbd8"'  88       88    "Y888         
#               88                                                   
#               88                                                   
#  8b,dPPYba,   88  ,adPPYYba,  8b       d8   ,adPPYba,  8b,dPPYba,  
#  88P'    "8a  88  ""     `Y8  `8b     d8'  a8P_____88  88P'   "Y8  
#  88       d8  88  ,adPPPPP88   `8b   d8'   8PP"""""""  88          
#  88b,   ,a8"  88  88,    ,88    `8b,d8'    "8b,   ,aa  88          
#  88`YbbdP"'   88  `"8bbdP"Y8      Y88'      `"Ybbd8"'  88          
#  88                               d8'                              
#  88                              d8'

event_player:
  mode_hilo_stopping: 
    - fade_in_base_music
    - release_left_vuk_ball
    - disable_base_left_vuk_hold
  hilo_done:
    - stop_hilo|2s


timers:
  time_out:
    start_value: 10
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: mode_hilo_started
      - action: restart
        event: reset_timer
    

sound_pools:
  hilo_gamble_or_cash_out_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_gamble_or_cash_out1 # Whatcha Thinkin?
      - hilo_gamble_or_cash_out2 # What's it gonna be?
      - hilo_gamble_or_cash_out3 # Feelin' Lucky?

  hilo_higher_lower_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_higher_lower1 # Higher or lower
      - hilo_higher_lower2 # You goin high or low?
      - hilo_higher_lower3 # Up or down?

  hilo_win_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_win1 # Got me that time
      - hilo_win2 # Hey look at you
      - hilo_win3 # Are you gonna let me win once in a while?
      - hilo_win4 # Damn, you win.
  
  hilo_lose_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_lose1 # Uh huh. I win this round
      - hilo_lose2 # Better luck next time
      - hilo_lose3 # Gotcha that time
      - hilo_lose4 # You can come back another time (unless you know what's good for ya)

  hilo_higher_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_higher1 # Let's see higher
      - hilo_higher2 # Ok higher it is buddy
      - hilo_higher3 # You want higher? Done.

  hilo_lower_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_lower1 # Let's see lower
      - hilo_lower2 # Come on lower
      - hilo_lower3 # You want lower? Ok I guess.

  hilo_gamble_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_gamble1 # Hey I like you're style
      - hilo_gamble2 # Let's do this
      - hilo_gamble3 # I hope you know what you're doin

  hilo_cash_out_pool:
    type: random_force_all
    track: voice
    sounds:
      - hilo_cash_out1 # Callin it a day, huh?
      - hilo_cash_out2 # See you again soon!
      - hilo_cash_out3 # That's all for now

  


