mode_settings:
  display_delay_ms: 1500
  hurry_up_delay_ms: 500
  hurry_up_event: flipper_cancel
  bonus_entries:
      - event: quarter_bonus
        # number quarters * album value
        score: current_player.quarters * 25000 #
      # - event: album_bonus
      #   score: current_player.quarter_bonus_total * current_player.num_albums
      # - event: wizard_bonus
      #   # 25k per wizard shot * num albums completed
      #   score: current_player.wizard_score * current_player.num_albums

variable_player:
  quarter_bonus:
    quarter_value:
      int: current_player.quarters * 25000
    total_bonus_value:
      int: current_player.quarters * 25000 * current_player.multiplier
      action: set
    
    # These are set every time, but not always used. Base mode custom code uses these to determine what to do.
    temp_multiplier:
      int: current_player.multiplier
      action: set
    temp_album_value:
      int: current_player.album_value
      action: set
    temp_album_name:
      string: (player|album_name)
      action: set
  bonus_total:
    score: current_player.total_bonus_value





