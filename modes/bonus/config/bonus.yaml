      style: big #dmd_big
      number_grouping: true
      color: gold
      y: 24%
      animations:
        pre_show_slide:
        - property: opacity
          value: 0
          duration: 50ms
          easing: in_quint
        - property: opacity
          value: 1
          duration: 50ms
          repeat: true
          easing: in_quint
