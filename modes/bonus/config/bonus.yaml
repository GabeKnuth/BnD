      - type: text
        text: (player|quarter_value)
        style: big #dmd_big
        number_grouping: true
  bonus_multiplier:
    bonus_multiplier:
      - type: text
        text: (player|multiplier)X
        style: huge
        x: left+20
        anchor_x: left
        font_size: 44
        color: red
      - type: text
        text: ALBUM
        style: huge
        font_size: 21
        y: top+4
        anchor_y: top
        color: red
        x: 82
      - type: text
        text: AWARDS
        style: huge
        font_size: 21
        y: bottom-4
        anchor_y: bottom
        color: red
