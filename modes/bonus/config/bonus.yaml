slide_player:
  bonus_start:
    bonus_start:
    - type: image
      image: bonus_bg_cc
      anchor_x: middle
      anchor_y: top
      x: middle
      y: top
    - type: text
      text: END OF BALL BONUS
      style: big #dmd_big
  quarter_bonus:
    quarter_bonus:
    - type: image
      image: bonus_bg_cc
      anchor_x: middle
      anchor_y: top
      x: middle
      y: top
    - type: text
      text: (player|quarters) QUARTERS
      y: top-7
      anchor_y: top
      style: big #dmd_big
    - type: text
      y: middle-5
      text: X
      style: small 
    - type: text
      text: "25,000"
      #text: "(player|album_name) VALUE: (player|album_value)"
      y: bottom+2
      anchor_y: bottom
      style: small 
      number_grouping: true





      
