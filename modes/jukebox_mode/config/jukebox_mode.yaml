# Now we need to play the video. The first event needs to be just the song. Each one
# after that should be record scratch, then song, so we also have a sound_player config
# that plays the sound only after the first time the jukebox is hit.

slide_player:
  player_jukebox_mode_jukebox_mode_timer_tick: jb_instructions

#             88  88           88                         
#             88  ""           88                         
#             88               88                         
#  ,adPPYba,  88  88   ,adPPYb,88   ,adPPYba,  ,adPPYba,  
#  I8[    ""  88  88  a8"    `Y88  a8P_____88  I8[    ""  
#   `"Y8ba,   88  88  8b       88  8PP"""""""   `"Y8ba,   
#  aa    ]8I  88  88  "8a,   ,d88  "8b,   ,aa  aa    ]8I  
#  `"YbbdP"'  88  88   `"8bbdP"Y8   `"Ybbd8"'  `"YbbdP"'

slides:
  jb_instructions:
      - type: text
        text: Change the song!
        style: big #dmd_big
        y: center+3
        animations:
          show_slide:
            - property: opacity
              value: 1
              duration: .4s
            - property: opacity
              value: 1
              duration: 2s
            - property: opacity
              value: 0
              duration: .4s
            - property: opacity
              value: 0
              duration: 2s
              repeat: true
      - type: text
        text: (score)
        style: big #dmd_big
        opacity: 0
        y: center+3
        number_grouping: true
        animations:
          show_slide:
            - property: opacity
              value: 0
              duration: .4s
            - property: opacity
              value: 0
              duration: 2s
            - property: opacity
              value: 1
              duration: .4s
            - property: opacity
              value: 1
              duration: 2s
              repeat: true
      - type: text
        text: Time left (jukebox_mode_jukebox_mode_timer_tick)
        anchor_y: bottom
        y: bottom+2
        style: small 
  jb_intro:
      - type: text
        text: BAD TUNES JUKEBOX!
        style: big #dmd_big
        anchor_y: top
        y: top-1
        color: red
      - type: text
        text: HIT JUKEBOX TO CHANGE SONG
        style: small 
        anchor_x: left
        x: left+1
      - type: text
        text: 9 HITS
        style: big #dmd_big
        anchor_y: bottom
        y: bottom+1
        anchor_x: left
        x: left+6
        color: yellow
      - type: text
        text: "="
        style: big #dmd_big
        anchor_y: bottom
        y: bottom+3
        anchor_x: left
        x: left+46
        color: yellow
      - type: text
        text: MULTIBALL!
        style: big #dmd_big
        anchor_y: bottom
        y: bottom+1
        anchor_x: left
        x: left+58
        color: yellow
        animations:
          show_slide:
            - property: opacity
              value: .7
              duration: .05
            - property: opacity
              value: 1
              duration: .05
              repeat: true

