slide_player:
  tilt_warning_1: tilt_warning_1_slide
  tilt_warning_2: tilt_warning_2_slide
  tilt: tilt_slide
  tilt_clear:
    tilt:
      action: remove


#             88  88           88                         
#             88  ""           88                         
#             88               88                         
#  ,adPPYba,  88  88   ,adPPYb,88   ,adPPYba,  ,adPPYba,  
#  I8[    ""  88  88  a8"    `Y88  a8P_____88  I8[    ""  
#   `"Y8ba,   88  88  8b       88  8PP"""""""   `"Y8ba,   
#  aa    ]8I  88  88  "8a,   ,d88  "8b,   ,aa  aa    ]8I  
#  `"YbbdP"'  88  88   `"8bbdP"Y8   `"Ybbd8"'  `"YbbdP"'

slides:
  tilt_warning_1_slide:
    widgets:
    - type: text
      text: WARNING!
      style: big #dmd_big
      color: red
    - type: line
      points: 1, 0, 1, 32, 128, 32, 128, 1, 1, 1
      color: orange
    - type: line
      points: 2, 1, 2, 31, 127, 31, 127, 2, 2, 2
      color: yellow
    expire: 1s

  tilt_warning_2_slide:
    widgets:
    - type: text
      text: WARNING!
      style: big #dmd_big
      color: red
      y: 22
    - type: text
      text: WARNING!
      style: big #dmd_big
      color: red
      y: 10
    - type: line
      points: 1, 0, 1, 32, 128, 32, 128, 1, 1, 1
      color: orange
    - type: line
      points: 2, 1, 2, 31, 127, 31, 127, 2, 2, 2
      color: yellow
    expire: 2s

  tilt_slide:
    widgets:
    - type: text
      text: TIL
      style: medium 
      color: red
      x: 60
    - type: text
      text: T
      style: medium 
      color: red
      x: 69
    - type: line
      points: 1, 0, 1, 32, 128, 32, 128, 1, 1, 1
      color: orange
    - type: line
      points: 2, 1, 2, 31, 127, 31, 127, 2, 2, 2
      color: yellow