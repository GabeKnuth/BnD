variable_player:
  mys_score_10_points:
    score: 10
  mys_score_big_points:
    score: 1000000
  mys_score_quarter: # doing one at a time in hopes that we can avoid skipping a quarter award.
    quarters: 1
  award_mystery_lock:
    htmb_balls_locked: 1

