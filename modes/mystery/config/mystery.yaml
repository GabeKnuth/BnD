slides:
  mys_sl_title:
    widgets:
      - type: text
        text: MYSTERY AWARD
        style: huge 
        color: red
        font_size: 1
        animations:
          show_slide:
            - property: font_size
              value: 25
              duration: .3s
  mys_sl_spot_quarters:
    widgets:
      - type: text
        text: SPOT QUARTERS
        color: red
        style: big #dmd_big
  mys_sl_jukebox_jamboree:
    widgets:
      - type: text
        text: Jukebox Jamboree
        color: red
        style: big #dmd_big
  mys_sl_ball_saver:
    widgets:
      - type: text
        text: START BALL SAVER
        color: red
        style: big #dmd_big
  mys_sl_ball_saver_2:
    widgets:
      - type: text
        text: BALL SAVER ACTIVE
        color: red
        style: big #dmd_big
        anchor_y: top
        y: top-4
      - type: text
        text: FOR 15 SECONDS
        anchor_y: bottom
        y: bottom+4
        color: white
        style: big #dmd_big
  mys_sl_hold_album_value:
    widgets:
      - type: text
        text: HOLD BONUS
        color: red
        style: huge
        anchor_y: top
        y: top+3
      - type: text
        text: MULTIPLIER
        color: red
        style: huge
        anchor_y: bottom
        y: bottom-3
  mys_sl_start_multiball:
    widgets:
      - type: text
        text: START MULTIBALL
        color: red
        style: big #dmd_big
  mys_sl_start_mission:
    widgets:
      - type: text
        text: START MISSION
        color: red
        style: big #dmd_big
  mys_sl_extra_ball:
    widgets:
      - type: text
        text: EXTRA BALL
        style: huge 
        color: red
        font_size: 0
        reset_animations_events: pre_show_slide
        animations:
          show_slide:
           - property: font_size
             value: 100
             duration: .3s
           - property: font_size
             value: 35
             duration: .3s
           - property: font_size
             value: 100
             duration: .3s
           - property: font_size
             value: 35
             duration: .3s
           - property: font_size
             value: 100
             duration: .3s
           - property: font_size
             value: 35
             duration: .3s
  mys_sl_10_points:
    widgets:
      - type: text
        text: 10 POINTS
        color: red
        style: big #dmd_big
  mys_sl_big_points:
    widgets:
      - type: text
        text: BIG POINTS
        color: red
        style: big #dmd_big
  mys_sl_big_points_2:
    widgets:
      - type: text
        text: "1,000,000!"
        color: gold
        style: big #dmd_big
  mys_sl_weak_flippers:
    widgets:
      - type: text
        text: WEAK FLIPPERS
        color: red
        style: big #dmd_big
  mys_sl_weak_flippers_2:
    widgets:
      - type: text
        text: LOW POWER FLIPPERS
        anchor_y: top
        y: top-4
        color: red
        style: big #dmd_big
      - type: text
        text: FOR 30 SECONDS
        anchor_y: bottom
        y: bottom+4
        color: white
        style: big #dmd_big
  mys_sl_weak_flippers_3:
    widgets:
      - type: text
        text: ALL SCORES
        color: red
        style: big #dmd_big
        anchor_x: left
        x: left+3
      - type: text
        text: DOUBLED!
        color: white
        anchor_x: right
        x: right-2
        style: big #dmd_big
  mys_sl_white_box:
    widgets:
      - type: rectangle
        width: 128
        height: 32
        color: white
        opacity: 0
        animations:
          show_slide: fade_in
  mys_sl_quarter_1:
    widgets:
      - type: image
        image: quarter
        anchor_x: left
        x: left
      - type: rectangle
        width: 128
        height: 32
        color: black
  mys_sl_quarter_2:
    widgets:
      - type: image
        image: quarter
        anchor_x: left
        x: left
      - type: image
        image: quarter
        anchor_x: center
        x: center
      - type: rectangle
        width: 128
        height: 32
        color: black
  mys_sl_quarter_3:
    widgets:
      - type: image
        image: quarter
        anchor_x: left
        x: left
      - type: image
        image: quarter
        anchor_x: center
        x: center
      - type: image
        image: quarter
        anchor_x: right
        x: right
      - type: rectangle
        width: 128
        height: 32
        color: black
  mys_sl_award_lock:
    widgets:
      - type: text
        text: AWARD LOCK
        color: red
        style: big #dmd_big
  mys_sl_ball_locked_slide:
    widgets:
      - type: text
        text: BALL (player|htmb_balls_locked) LOCKED
        style: huge 
        color: black
        font_size: 30
        animations:
          show_slide:
            - property: opacity
              value: 0
              duration: .2s
            - property: opacity
              value: 1
              duration: .2s
              repeat: true
      - type: rectangle
        width: 128
        height: 32
        color: lime
