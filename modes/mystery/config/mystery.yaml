show_player:
  mode_mystery_started:
    rainbow:
      show_tokens:
        lights: l_mystery
      loops: -1
    mys_intro_show:
      loops: 0
  mys_spot_quarters:
    spot_quarters_show:
      loops: 0
  mys_start_ball_saver:
    start_ball_saver_show:
      loops: 0
  mys_hold_album_value:
    hold_album_value_show:
      loops: 0
  mys_start_multiball:
    start_multiball_show:
      loops: 0
  mys_start_mission:
    start_mission_show:
      loops: 0
  mys_jukebox_jamboree:
    start_jukebox_jamboree_show:
      loops: 0
  mys_extra_ball:
    start_extra_ball_show:
      loops: 0
  mys_10_points:
    10_points_show:
      loops: 0
  mys_big_points:
    big_points_show:
      loops: 0
  mys_weak_flippers:
    weak_flippers_show:
      loops: 0
  mys_award_lock:
    award_lock_show:
      loops: 0
